[tools]
go = "1.25"

node = "25"
bun = "latest"

rust = "latest"

python = "3.14"
uv = "0.9.24"

# Other tools
"npm:tokscale" = "latest"
# tk (wedow/ticket), the issue tracker: one bash script, with tickets as
# markdown files in .tickets/. It publishes no release assets, so mise fetches
# the script itself at the pinned tag. `tk query` needs jq.
"http:tk" = { version = "0.3.2", url = "https://raw.githubusercontent.com/wedow/ticket/v{{version}}/ticket", bin = "tk" }

[settings]
npm.package_manager = "bun"
