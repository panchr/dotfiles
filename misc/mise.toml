[tools]
go = "1.25"

node = "25"
bun = "latest"

rust = "latest"

python = "3.14"
uv = "0.9.24"

# Language servers
"go:golang.org/x/tools/gopls" = "latest"
"npm:bash-language-server" = "latest"
"npm:pyright" = "latest"
"npm:typescript" = "latest"
"npm:typescript-language-server" = "latest"

# Other tools
"npm:tokscale" = "latest"
# bd, the issue tracker. Pinned so every machine writes .beads/issues.jsonl
# the same way; bd versions disagree on its format and thrash the file.
"aqua:steveyegge/beads" = "1.3.2"

[settings]
npm.package_manager = "bun"
